llm_provider: fake
llm_model: null
openai_model: gpt-4o-mini
anthropic_model: claude-sonnet-4-5-20250929
anthropic_structured_outputs: null
llm_max_tokens: 4096
llm_temperature: 0.0
opencode_base_url: http://localhost:4096
opencode_model: null
opencode_timeout_seconds: 120
